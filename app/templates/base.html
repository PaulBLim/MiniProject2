<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FastAPI Static Templating{% endblock %}</title>
    <link
    rel="stylesheet"
    href="{{ url_for('static', path='/style.css') }}"
>
</head>
<body>
    <header>
        <nav>
            <img
                src="{{ url_for('static', path='/logo.webp') }}"
                alt="Task Manager logo"
                class="logo"
            >
            <a href="/">Tasks</a>
            <a href="/docs">API documentation</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 FastAPI Static Templating Example</p>
    </footer>
</body>
</html>
